name: Apply Fitness HQ grounding patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'Apply Fitness HQ grounding patch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out live branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Load patch script from main
        run: |
          git fetch origin main
          git show origin/main:.github/apply_analysis_key_migration.py > /tmp/apply_analysis_key_migration.py
          python /tmp/apply_analysis_key_migration.py
      - name: Validate patch
        run: |
          node --check refresh-worker/src/index.js
          grep -q 'WORKER_VERSION = "2026-09-14c"' refresh-worker/src/index.js
          grep -q 'function healthContextPoints' refresh-worker/src/index.js
          grep -q 'function groundedWorkoutSignals' refresh-worker/src/index.js
          git diff --check
      - name: Commit live patch
        run: |
          git config user.name "Fitness HQ Migration"
          git config user.email "actions@users.noreply.github.com"
          git add refresh-worker/src/index.js
          git commit -m "Ground Fitness HQ generated health and workout data"
          git push origin HEAD:gh-pages
