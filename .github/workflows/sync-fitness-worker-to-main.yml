name: Repair Fitness HQ shell from source

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'Repair Fitness HQ shell from source'
    runs-on: ubuntu-latest
    steps:
      - name: Check out live branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Load repair script from main
        run: |
          git fetch origin main
          git show origin/main:.github/repair_fitness_pwa_shell.py > /tmp/repair_fitness_pwa_shell.py
          python /tmp/repair_fitness_pwa_shell.py

      - name: Validate repaired shell
        run: |
          node --check app.js
          node --check sw.js
          grep -q 'const APP_VERSION = "3.2.10"' app.js
          grep -q 'v3.2.10' index.html
          grep -q 'logo-c5edccef-3.2.10' index.html
          grep -q 'fitness-hq-v66' sw.js
          if grep -q 'app-hotfix.js' sw.js; then echo 'temporary hotfix still injected' && exit 1; fi
          git diff --check

      - name: Commit live repair
        run: |
          git config user.name "Fitness HQ Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add app.js index.html sw.js manifest.webmanifest
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Repair Fitness HQ PWA shell and logo cache"
          for attempt in 1 2 3; do
            if git push origin HEAD:gh-pages; then exit 0; fi
            git fetch origin gh-pages
            git rebase origin/gh-pages
          done
          exit 1
