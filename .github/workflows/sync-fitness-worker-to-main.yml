name: Sync Fitness HQ worker source to main

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-worker:
    if: github.event.head_commit.message == 'Sync Fitness HQ worker source to main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out live branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Make worker authentication fail safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('refresh-worker/src/index.js')
          s = p.read_text()
          old = '''async function authenticate(body, env, signedPayload = "") {
  if (!validEnvelope(body)) return false;
  const actual = decodeHex(body.signature);
  const expected = await expectedSignature(env.REFRESH_SHARED_SECRET, `${body.timestamp}.${body.nonce}${signedPayload ? `.${signedPayload}` : ""}`);
  return equalBytes(actual, expected);
}'''
          new = '''async function authenticate(body, env, signedPayload = "") {
  if (!validEnvelope(body) || !env.REFRESH_SHARED_SECRET) return false;
  try {
    const actual = decodeHex(body.signature);
    const expected = await expectedSignature(env.REFRESH_SHARED_SECRET, `${body.timestamp}.${body.nonce}${signedPayload ? `.${signedPayload}` : ""}`);
    return equalBytes(actual, expected);
  } catch (error) {
    console.error("Worker authentication failed", error);
    return false;
  }
}'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one authenticate block, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch to live branch
        run: |
          git config user.name "Fitness HQ Migration"
          git config user.email "actions@users.noreply.github.com"
          git add refresh-worker/src/index.js
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Make Fitness HQ worker authentication fail safely"
            git push origin HEAD:gh-pages
          fi
