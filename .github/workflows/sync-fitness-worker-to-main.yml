name: Sync Fitness HQ worker source to main

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-worker:
    if: github.event.head_commit.message == 'Sync Fitness HQ worker source to main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Copy worker from live branch
        run: |
          git fetch origin gh-pages
          git checkout origin/gh-pages -- refresh-worker
      - name: Commit worker source to main
        run: |
          git config user.name "Fitness HQ Migration"
          git config user.email "actions@users.noreply.github.com"
          git add refresh-worker
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Add Fitness HQ worker source for Cloudflare builds"
            git push origin HEAD:main
          fi
