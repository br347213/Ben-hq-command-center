name: Cleanup Fitness HQ migration scaffolding

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Cleanup Fitness HQ migration scaffolding'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove one-off migration and diagnostic files
        run: |
          git rm -f --ignore-unmatch \
            .github/analysis-key-run-trigger \
            .github/fitness-hq-auth-patch-trigger \
            .github/apply_analysis_key_migration.py \
            .github/repair_fitness_pwa_shell.py \
            .github/workflows/apply-analysis-key.yml \
            .github/workflows/fitness-hq-auth-diagnostic.yml \
            .github/workflows/fitness-hq-next-fixes.yml \
            .github/workflows/fitness-hq-smoke-test.yml \
            .github/workflows/fix-fitness-pwa-shell.yml \
            .github/workflows/sync-fitness-worker-to-main.yml

      - name: Commit cleanup
        run: |
          git config user.name "Fitness HQ Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Remove Fitness HQ migration scaffolding"
          git push origin HEAD:main
