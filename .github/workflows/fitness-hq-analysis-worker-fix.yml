name: Fix Fitness HQ live analysis worker

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-and-deploy:
    if: github.event.head_commit.message == 'Fix Fitness HQ live analysis worker'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out live Fitness HQ branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Switch live analysis to fast JSON-mode model
        run: |
          python - <<'PY'
          from pathlib import Path

          worker = Path('refresh-worker/src/index.js')
          text = worker.read_text(encoding='utf-8')
          old_model = 'const ANALYSIS_MODEL = "@cf/openai/gpt-oss-20b";'
          new_model = 'const ANALYSIS_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast";'
          if text.count(old_model) != 1:
              raise SystemExit(f'expected one old model declaration, found {text.count(old_model)}')
          text = text.replace(old_model, new_model, 1)
          if text.count('            reasoning_effort: "low",\n') != 1:
              raise SystemExit('expected one gpt-oss reasoning_effort option')
          text = text.replace('            reasoning_effort: "low",\n', '', 1)
          worker.write_text(text, encoding='utf-8')

          test = Path('scripts/test-live-analysis-worker.mjs')
          test_text = test.read_text(encoding='utf-8')
          old_name = '@cf/openai/gpt-oss-20b'
          new_name = '@cf/meta/llama-3.1-8b-instruct-fast'
          if test_text.count(old_name) != 2:
              raise SystemExit(f'expected two old model references, found {test_text.count(old_name)}')
          test.write_text(test_text.replace(old_name, new_name), encoding='utf-8')
          PY

      - name: Install worker dependencies
        working-directory: refresh-worker
        run: npm install --no-audit --no-fund

      - name: Run live-analysis worker tests
        run: node scripts/test-live-analysis-worker.mjs

      - name: Save worker source fix
        run: |
          git config user.name "Fitness HQ Migration"
          git config user.email "actions@users.noreply.github.com"
          git add refresh-worker/src/index.js scripts/test-live-analysis-worker.mjs
          git diff --cached --check
          git commit -m "Use fast JSON-mode model for Fitness HQ analysis"
          git push origin HEAD:gh-pages

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not configured in GitHub Actions"
            exit 2
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is not configured in GitHub Actions"
            exit 2
          fi
          cd refresh-worker
          npx --yes wrangler@4 deploy

      - name: Smoke test deployed analysis endpoint
        env:
          BEN_HQ_SYNC_KEY: ${{ secrets.BEN_HQ_SYNC_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          const secret = process.env.BEN_HQ_SYNC_KEY || '';
          if (!secret) throw new Error('BEN_HQ_SYNC_KEY unavailable');
          const contextJson = JSON.stringify({
            schemaVersion: 1,
            currentDate: new Date().toISOString().slice(0, 10),
            athlete: { name: 'Ben' },
            training: { weeklyLoad: {}, latestCompletedWorkout: null },
            runningDays: [],
          });
          const timestamp = Date.now();
          const nonce = crypto.randomUUID();
          const signature = crypto.createHmac('sha256', secret).update(`${timestamp}.${nonce}.${contextJson}`).digest('hex');
          const response = await fetch('https://ben-hq-garmin-refresh.br347213.workers.dev/analyze', {
            method: 'POST',
            headers: { origin: 'https://br347213.github.io', 'content-type': 'application/json' },
            body: JSON.stringify({ timestamp, nonce, signature, contextJson }),
          });
          const payload = await response.text();
          console.log(`HTTP ${response.status}`);
          console.log(payload.slice(0, 1200));
          if (response.status !== 200) process.exit(1);
          NODE
