name: Refresh Garmin dashboard

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: garmin-dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out dashboard
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Garmin connector
        run: python -m pip install --disable-pip-version-check garminconnect==0.3.3

      - name: Restore latest Garmin session
        id: garmin-cache
        uses: actions/cache/restore@v4
        with:
          path: .private/garmin/tokens
          key: garmin-tokenstore-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            garmin-tokenstore-

      - name: Prepare private inputs
        env:
          BEN_HQ_SYNC_KEY: ${{ secrets.BEN_HQ_SYNC_KEY }}
          GARMIN_TOKENSTORE_B64: ${{ secrets.GARMIN_TOKENSTORE_B64 }}
        run: |
          mkdir -p .private/garmin/tokens
          printf '%s' "$BEN_HQ_SYNC_KEY" > .private/sync-key.txt
          if [ ! -f .private/garmin/tokens/garmin_tokens.json ] && [ -n "$GARMIN_TOKENSTORE_B64" ]; then
            python -c "import base64, os, pathlib; pathlib.Path('.private/garmin/tokens/garmin_tokens.json').write_bytes(base64.b64decode(os.environ['GARMIN_TOKENSTORE_B64']))"
          fi

      - name: Preserve the latest personal analysis
        run: node scripts/extract-packet-analysis.mjs data/ben-hq-latest.enc.json .private/sync-key.txt .private/fitness-analysis.json

      - name: Pull Garmin health and training data
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: python scripts/fetch-garmin-summary.py --summary .private/garmin/garmin-summary.json --tokenstore .private/garmin/tokens

      - name: Rebuild activity history and training intelligence
        run: python scripts/enrich-garmin-activity-history.py --summary .private/garmin/garmin-summary.json --tokenstore .private/garmin/tokens --start-date 2026-01-01

      - name: Build encrypted dashboard packet
        env:
          ALLOW_STALE_ANALYSIS: "1"
        run: node scripts/build-garmin-packet.mjs .private/garmin/garmin-summary.json .private/sync-key.txt data/ben-hq-latest.enc.json .private/fitness-analysis.json

      - name: Save refreshed Garmin session
        uses: actions/cache/save@v4
        with:
          path: .private/garmin/tokens
          key: garmin-tokenstore-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish encrypted data
        run: |
          git config user.name "Fitness HQ Sync"
          git config user.email "actions@users.noreply.github.com"
          git add data/ben-hq-latest.enc.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Garmin dashboard data"
            git push origin HEAD:gh-pages
          fi
