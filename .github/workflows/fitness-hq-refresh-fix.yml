name: Fix Fitness HQ manual Garmin refresh

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run Fitness HQ refresh patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Load patch script
        run: |
          git fetch origin main
          git show origin/main:.github/patch_fitness_refresh.py > /tmp/patch_fitness_refresh.py
          python /tmp/patch_fitness_refresh.py
      - name: Validate
        run: |
          node --check app.js
          node --check sw.js
          node --check refresh-worker/src/index.js
          grep -q 'const APP_VERSION = "3.2.11"' app.js
          grep -q 'WORKER_VERSION = "2026-09-16a"' refresh-worker/src/index.js
          grep -q 'fitness-hq-v68' sw.js
          git diff --check
      - name: Publish
        run: |
          git config user.name "Fitness HQ Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add app.js index.html sw.js manifest.webmanifest refresh-worker/src/index.js
          git commit -m "Fix Fitness HQ manual Garmin refresh behavior"
          git push origin HEAD:gh-pages
