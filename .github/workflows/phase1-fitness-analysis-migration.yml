name: Apply Fitness HQ Phase 1 analysis migration

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: fitness-hq-phase1-analysis-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event.head_commit.message == 'Run Phase 1 Fitness HQ migration'
    runs-on: ubuntu-latest
    steps:
      - name: Check out live Fitness HQ branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Apply Phase 1 app.js changes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app.js")
          text = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              'const GARMIN_REFRESH_POLL_MS = 2500;\nconst GARMIN_REFRESH_MAX_POLLS = 48;\nconst APP_VERSION = "3.2.5";',
              'const GARMIN_REFRESH_POLL_MS = 2500;\nconst GARMIN_REFRESH_MAX_POLLS = 48;\nconst DAILY_ANALYSIS_WINDOWS = Object.freeze([\n  { id: "morning", startHour: 6 },\n  { id: "midday", startHour: 12 },\n  { id: "evening", startHour: 18 },\n]);\nconst APP_VERSION = "3.2.6";',
              "analysis window constants",
          )

          replace_once(
              '  liveAnalysis: "fitness-hq-live-analysis-v8",\n  liveAnalysisHistory: "fitness-hq-live-analysis-history-v8",\n};',
              '  liveAnalysis: "fitness-hq-live-analysis-v8",\n  liveAnalysisHistory: "fitness-hq-live-analysis-history-v8",\n  analysisWindow: "fitness-hq-analysis-window-v1",\n};',
              "analysis window storage",
          )

          replace_once(
              'let liveAnalysisState = { status: liveAnalysis ? "ready" : "idle", reason: "", error: "" };\nlet liveAnalysisRequest = null;\nlet toastTimer = null;',
              'let liveAnalysisState = { status: liveAnalysis ? "ready" : "idle", reason: "", error: "" };\nlet liveAnalysisRequest = null;\nlet analysisAttemptedThisSession = false;\nlet toastTimer = null;',
              "session analysis state",
          )

          replace_once(
              'function localDateKey(value = new Date()) {\n  const date = value instanceof Date ? value : new Date(value);\n  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;\n}\n\nfunction parseLocalDateKey(key) {',
              'function localDateKey(value = new Date()) {\n  const date = value instanceof Date ? value : new Date(value);\n  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;\n}\n\nfunction currentAnalysisWindow(now = new Date()) {\n  const slot = [...DAILY_ANALYSIS_WINDOWS].reverse().find((item) => now.getHours() >= item.startHour);\n  if (!slot) return null;\n  return { ...slot, key: `${localDateKey(now)}:${slot.id}` };\n}\n\nfunction markCurrentAnalysisWindow(now = new Date()) {\n  const slot = currentAnalysisWindow(now);\n  if (slot) writeJson(STORAGE.analysisWindow, slot.key);\n}\n\nasync function requestScheduledAnalysis(now = new Date()) {\n  const slot = currentAnalysisWindow(now);\n  if (!slot || analysisAttemptedThisSession || readJson(STORAGE.analysisWindow, "") === slot.key) return false;\n  return requestLiveAnalysis(`${slot.id} daily analysis`);\n}\n\nfunction parseLocalDateKey(key) {',
              "analysis window helpers",
          )

          replace_once(
              '  liveAnalysisState = { status: "loading", reason, error: "" };\n  document.body.classList.add("analysis-loading");',
              '  analysisAttemptedThisSession = true;\n  liveAnalysisState = { status: "loading", reason, error: "" };\n  document.body.classList.add("analysis-loading");',
              "analysis attempt tracking",
          )

          replace_once(
              '      liveAnalysisState = { status: "ready", reason, error: "" };\n      renderAllTracking();\n      return true;\n    } catch (error) {\n      liveAnalysis = null;\n      removeStored(STORAGE.liveAnalysis);\n      liveAnalysisState = { status: "error", reason, error: error?.message || "Live coaching analysis is unavailable." };',
              '      markCurrentAnalysisWindow();\n      liveAnalysisState = { status: "ready", reason, error: "" };\n      renderAllTracking();\n      return true;\n    } catch (error) {\n      liveAnalysisState = { status: "error", reason, error: error?.message || "Live coaching analysis is unavailable." };',
              "last-known-good analysis preservation",
          )

          replace_once(
              '  try {\n    installPrivatePacket(await fetchLatestPrivatePacket(), showResult);\n    return true;\n  } catch {',
              '  try {\n    const previousGeneratedAt = privatePacket.generatedAt;\n    const packet = await fetchLatestPrivatePacket();\n    installPrivatePacket(packet, showResult);\n    const previousTime = Date.parse(previousGeneratedAt || "") || 0;\n    const packetTime = Date.parse(packet.generatedAt || "") || 0;\n    if (packetTime > previousTime) await requestLiveAnalysis("new Garmin data");\n    return true;\n  } catch {',
              "new Garmin analysis trigger",
          )

          replace_once(
              '  await refreshGarminData(false);\n  await requestLiveAnalysis("app reload");',
              '  await refreshGarminData(false);\n  await requestScheduledAnalysis();',
              "scheduled init analysis",
          )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate JavaScript and Phase 1 rules
        run: |
          node --check app.js
          grep -q 'DAILY_ANALYSIS_WINDOWS' app.js
          grep -q 'requestScheduledAnalysis' app.js
          grep -q 'requestLiveAnalysis("new Garmin data")' app.js
          grep -q 'requestLiveAnalysis("manual Garmin refresh")' app.js
          if grep -q 'requestLiveAnalysis("app reload")' app.js; then
            echo "app reload analysis trigger still present"
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          text = Path("app.js").read_text(encoding="utf-8")
          request_block = text[text.index('async function requestLiveAnalysis'):text.index('function recommendedEasyHrRange')]
          if 'liveAnalysis = null' in request_block or 'removeStored(STORAGE.liveAnalysis)' in request_block:
              raise SystemExit('live analysis failure still clears last-known-good analysis')
          PY

      - name: Publish live app.js
        run: |
          git config user.name "Fitness HQ Migration"
          git config user.email "actions@users.noreply.github.com"
          git add app.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Apply Phase 1 analysis scheduling"
            git push origin HEAD:gh-pages
          fi
