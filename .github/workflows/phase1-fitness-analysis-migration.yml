name: Apply Fitness HQ Phase 1 analysis migration

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: fitness-hq-phase1-analysis-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event.head_commit.message == 'Add Phase 1 Fitness HQ migration runner' || github.event.head_commit.message == 'Run Phase 1 Fitness HQ migration'
    runs-on: ubuntu-latest
    steps:
      - name: Check out live Fitness HQ branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Apply Phase 1 app.js changes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app.js")
          text = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              '''const GARMIN_REFRESH_POLL_MS = 2500;
          const GARMIN_REFRESH_MAX_POLLS = 48;
          const APP_VERSION = "3.2.5";''',
              '''const GARMIN_REFRESH_POLL_MS = 2500;
          const GARMIN_REFRESH_MAX_POLLS = 48;
          const DAILY_ANALYSIS_WINDOWS = Object.freeze([
            { id: "morning", startHour: 6 },
            { id: "midday", startHour: 12 },
            { id: "evening", startHour: 18 },
          ]);
          const APP_VERSION = "3.2.6";''',
              "analysis window constants",
          )

          replace_once(
              '''  liveAnalysis: "fitness-hq-live-analysis-v8",
            liveAnalysisHistory: "fitness-hq-live-analysis-history-v8",
          };''',
              '''  liveAnalysis: "fitness-hq-live-analysis-v8",
            liveAnalysisHistory: "fitness-hq-live-analysis-history-v8",
            analysisWindow: "fitness-hq-analysis-window-v1",
          };''',
              "analysis window storage",
          )

          replace_once(
              '''let liveAnalysisState = { status: liveAnalysis ? "ready" : "idle", reason: "", error: "" };
          let liveAnalysisRequest = null;
          let toastTimer = null;''',
              '''let liveAnalysisState = { status: liveAnalysis ? "ready" : "idle", reason: "", error: "" };
          let liveAnalysisRequest = null;
          let analysisAttemptedThisSession = false;
          let toastTimer = null;''',
              "session analysis state",
          )

          replace_once(
              '''function localDateKey(value = new Date()) {
            const date = value instanceof Date ? value : new Date(value);
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
          }

          function parseLocalDateKey(key) {''',
              '''function localDateKey(value = new Date()) {
            const date = value instanceof Date ? value : new Date(value);
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
          }

          function currentAnalysisWindow(now = new Date()) {
            const slot = [...DAILY_ANALYSIS_WINDOWS].reverse().find((item) => now.getHours() >= item.startHour);
            if (!slot) return null;
            return { ...slot, key: `${localDateKey(now)}:${slot.id}` };
          }

          function markCurrentAnalysisWindow(now = new Date()) {
            const slot = currentAnalysisWindow(now);
            if (slot) writeJson(STORAGE.analysisWindow, slot.key);
          }

          async function requestScheduledAnalysis(now = new Date()) {
            const slot = currentAnalysisWindow(now);
            if (!slot || analysisAttemptedThisSession || readJson(STORAGE.analysisWindow, "") === slot.key) return false;
            return requestLiveAnalysis(`${slot.id} daily analysis`);
          }

          function parseLocalDateKey(key) {''',
              "analysis window helpers",
          )

          replace_once(
              '''  if (!syncSettings.key || !hasHealthData()) {
            liveAnalysisState = { status: "unavailable", reason, error: "Garmin data or the private sync key is unavailable." };
            renderAllTracking();
            return false;
          }
            liveAnalysisState = { status: "loading", reason, error: "" };''',
              '''  if (!syncSettings.key || !hasHealthData()) {
            liveAnalysisState = { status: "unavailable", reason, error: "Garmin data or the private sync key is unavailable." };
            renderAllTracking();
            return false;
          }
            analysisAttemptedThisSession = true;
            liveAnalysisState = { status: "loading", reason, error: "" };''',
              "analysis attempt tracking",
          )

          replace_once(
              '''      liveAnalysisState = { status: "ready", reason, error: "" };
                renderAllTracking();
                return true;
              } catch (error) {
                liveAnalysis = null;
                removeStored(STORAGE.liveAnalysis);
                liveAnalysisState = { status: "error", reason, error: error?.message || "Live coaching analysis is unavailable." };''',
              '''      markCurrentAnalysisWindow();
                liveAnalysisState = { status: "ready", reason, error: "" };
                renderAllTracking();
                return true;
              } catch (error) {
                liveAnalysisState = { status: "error", reason, error: error?.message || "Live coaching analysis is unavailable." };''',
              "last-known-good analysis preservation",
          )

          replace_once(
              '''  try {
            installPrivatePacket(await fetchLatestPrivatePacket(), showResult);
            return true;
          } catch {''',
              '''  try {
            const previousGeneratedAt = privatePacket.generatedAt;
            const packet = await fetchLatestPrivatePacket();
            installPrivatePacket(packet, showResult);
            const previousTime = Date.parse(previousGeneratedAt || "") || 0;
            const packetTime = Date.parse(packet.generatedAt || "") || 0;
            if (packetTime > previousTime) await requestLiveAnalysis("new Garmin data");
            return true;
          } catch {''',
              "new Garmin analysis trigger",
          )

          replace_once(
              '''  await refreshGarminData(false);
            await requestLiveAnalysis("app reload");''',
              '''  await refreshGarminData(false);
            await requestScheduledAnalysis();''',
              "scheduled init analysis",
          )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate JavaScript and Phase 1 rules
        run: |
          node --check app.js
          grep -q 'DAILY_ANALYSIS_WINDOWS' app.js
          grep -q 'requestScheduledAnalysis' app.js
          grep -q 'requestLiveAnalysis("new Garmin data")' app.js
          grep -q 'requestLiveAnalysis("manual Garmin refresh")' app.js
          if grep -q 'requestLiveAnalysis("app reload")' app.js; then
            echo "app reload analysis trigger still present"
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          text = Path("app.js").read_text(encoding="utf-8")
          catch_block = text[text.index('async function requestLiveAnalysis'):text.index('function recommendedEasyHrRange')]
          if 'liveAnalysis = null' in catch_block or 'removeStored(STORAGE.liveAnalysis)' in catch_block:
              raise SystemExit('live analysis failure still clears last-known-good analysis')
          PY

      - name: Publish live app.js
        run: |
          git config user.name "Fitness HQ Migration"
          git config user.email "actions@users.noreply.github.com"
          git add app.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Apply Phase 1 analysis scheduling"
            git push origin HEAD:gh-pages
          fi

