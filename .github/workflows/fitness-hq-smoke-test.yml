name: Fitness HQ live smoke test

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke-test:
    if: github.event.head_commit.message == 'Run Fitness HQ live smoke test'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check deployed Worker status
        run: |
          node --input-type=module <<'NODE'
          const endpoint = 'https://ben-hq-garmin-refresh.br347213.workers.dev/status';
          const started = Date.now();
          const response = await fetch(endpoint, { headers: { accept: 'application/json' } });
          const text = await response.text();
          console.log(`HTTP ${response.status}`);
          console.log(`Elapsed ${Date.now() - started} ms`);
          console.log(text);
          if (response.status !== 200) process.exit(1);
          const payload = JSON.parse(text);
          if (payload.workerVersion !== '2026-09-14b') process.exit(2);
          if (!payload.bindings?.ai || !payload.bindings?.analysisSecret) process.exit(3);
          NODE
