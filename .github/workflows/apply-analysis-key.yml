name: Apply Fitness HQ analysis key migration

on:
  push:
    branches: [main]
    paths:
      - '.github/analysis-key-run-trigger'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out live branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Load migration script from main
        run: |
          git fetch origin main
          git show origin/main:.github/apply_analysis_key_migration.py > /tmp/apply_analysis_key_migration.py
          python /tmp/apply_analysis_key_migration.py
      - name: Validate migration
        run: |
          node --check app.js
          node --check refresh-worker/src/index.js
          grep -q 'APP_VERSION = "3.2.8"' app.js
          grep -q 'id="enterAnalysisKey"' index.html
          grep -q 'ANALYSIS_SHARED_SECRET' refresh-worker/src/index.js
          grep -q 'fitness-hq-v64' sw.js
          git diff --check
      - name: Commit live migration
        run: |
          git config user.name "Fitness HQ Migration"
          git config user.email "actions@users.noreply.github.com"
          git add index.html app.js sw.js refresh-worker/src/index.js refresh-worker/README.md
          git commit -m "Separate Fitness HQ live analysis key"
          git push origin HEAD:gh-pages
